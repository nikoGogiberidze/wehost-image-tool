version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Electron, Sharp and electron-builder move together and each needs the
      # E2E suite run against it, so keep them out of the routine grouped bumps.
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'vite'
          - '@vitejs/*'
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
