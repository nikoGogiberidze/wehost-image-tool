version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

    # One PR per ecosystem rather than one per package — this is a small project
    # and a stream of individual bumps is noise, not signal.
    groups:
      npm-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

    # Major bumps are migrations, not updates. Electron, Sharp and
    # electron-builder changes need the E2E suite and the packaged-binary smoke
    # test run against them; electron-store v9+ is ESM-only and the main process
    # is CommonJS; Tailwind v4 replaces the JS config entirely; React 19 changes
    # rendering semantics. All of those want a human driving, so majors are
    # excluded here rather than arriving as PRs that sit and fail.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
