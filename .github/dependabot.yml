version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

    # One PR per ecosystem rather than one per package — this is a small project
    # and a stream of individual bumps is noise, not signal.
    groups:
      npm-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

    # Major bumps of these are migrations, not updates. They need a human to run
    # the E2E suite and the packaged-binary smoke test against them, so they are
    # excluded here rather than arriving as PRs that will always fail CI.
    ignore:
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      - dependency-name: electron-builder
        update-types: ['version-update:semver-major']
      - dependency-name: sharp
        update-types: ['version-update:semver-major']
      # electron-store v9+ is ESM-only; the main process is CommonJS and would
      # need the same dynamic-import treatment as shared/geometry.mjs.
      - dependency-name: electron-store
        update-types: ['version-update:semver-major']
      # Tailwind v4 replaces the JS config with CSS-first configuration.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-plugin-react-hooks
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
